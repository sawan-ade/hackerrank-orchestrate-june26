<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg_grad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#070B14"/>
            <stop offset="50%" stop-color="#0D1527"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <linearGradient id="accent_grad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#00EA64"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
        </pattern>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1200" height="420" fill="url(#bg_grad)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>

    <!-- Top Accent Bar -->
    <rect x="0" y="0" width="1200" height="5" fill="url(#accent_grad)"/>

    <!-- Subtle Tech Circuit Lines -->
    <path d="M 60 50 L 1140 50" stroke="#1E293B" stroke-width="1"/>
    <circle cx="60" cy="50" r="3" fill="#38BDF8"/>
    <circle cx="1140" cy="50" r="3" fill="#00EA64"/>

    <!-- HackerRank Tag & Edition -->
    <g transform="translate(60, 95)">
        <rect width="210" height="28" rx="6" fill="#00EA64" fill-opacity="0.12" stroke="#00EA64" stroke-opacity="0.5" stroke-width="1"/>
        <text x="14" y="19" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', monospace" font-size="12" font-weight="700" fill="#00EA64" letter-spacing="1.2">HACKERRANK ORCHESTRATE</text>
        
        <rect x="222" y="0" width="160" height="28" rx="6" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
        <text x="236" y="19" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', monospace" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">JUNE 2026 EDITION</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
        Multi-Modal Evidence Review
    </text>

    <!-- Subtitle / Mandate -->
    <text x="60" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#94A3B8">
        Autonomous Damage Claim Verification & Cross-Modal Consistency Agent
    </text>

    <!-- Stat Pills -->
    
        <g transform="translate(60, 320)">
            <rect width="466" height="42" rx="8" fill="#161F30" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5"/>
            <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="0.5">GLOBAL STANDING:</text>
            <text x="142" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Top 2.5% Finisher (~50–55 / 2,100)</text>
        </g>
        
        <g transform="translate(542, 320)">
            <rect width="349" height="42" rx="8" fill="#161F30" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5"/>
            <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="0.5">ALL REGISTRANTS:</text>
            <text x="142" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Top 0.35% (of 15,295)</text>
        </g>
        
        <g transform="translate(907, 320)">
            <rect width="277" height="42" rx="8" fill="#161F30" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5"/>
            <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="0.5">RECALL:</text>
            <text x="70" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">90.0% Fraud Detection</text>
        </g>
        
        <g transform="translate(1200, 320)">
            <rect width="273" height="42" rx="8" fill="#161F30" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5"/>
            <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="0.5">VALIDATION:</text>
            <text x="102" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">100% Schema Valid</text>
        </g>
        

    <!-- Right Corner Watermark / Emblem -->
    <g transform="translate(1010, 110)" opacity="0.85">
        <circle cx="65" cy="65" r="58" fill="#131D31" stroke="#38BDF8" stroke-width="2"/>
        <circle cx="65" cy="65" r="48" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>
        <text x="65" y="58" font-family="'SF Mono', monospace" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">GLOBAL</text>
        <text x="65" y="80" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">FINISHER</text>
    </g>
</svg>
